; FLORA firmware - ESP32-C3 (Arduino framework)
; Compilación NO verificada en el entorno de desarrollo (sin acceso al registro de PlatformIO): ver README.
[env:flora]
platform = espressif32@^6.9.0
board = esp32-c3-devkitm-1        ; mismo SoC; el módulo real es ESP32-C3-WROOM-02-N4 (4 MB flash)
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1   ; consola por el USB-C nativo (GPIO18/19)
lib_deps =
    olikraus/U8g2@^2.35.19

[env:native]
; pruebas de la lógica en el PC (sin hardware): pio test -e native
platform = native
test_framework = unity
build_flags = -std=gnu++17
