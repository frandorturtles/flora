<!doctype html>
<html lang="es" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flora</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf6ff;--bg2:#f1e6ff;--ink:#2a1b3d;--mut:#5e4b78;--v:#6b3fa3;--v2:#8a64c4;--lav:#d9c6f5;--rose:#f6c9de;--card:#ffffffcc;--line:#6b3fa026;--shadow:0 18px 50px #6b3fa326;--on:#fff;--ok:#3f8a5a;--warn:#d98a2b;--bad:#c2415a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16101f;--bg2:#1f1530;--ink:#f6ecff;--mut:#bba8d6;--v:#c9a6ff;--v2:#a57fe0;--lav:#3a2556;--rose:#5a2d47;--card:#2a1d3bcc;--line:#c9a6ff2a;--shadow:0 18px 50px #0006;--on:#1a0f2b;--ok:#6cc08a;--warn:#f0b05a;--bad:#ee7b92}}
:root[data-theme="dark"]{--bg:#16101f;--bg2:#1f1530;--ink:#f6ecff;--mut:#bba8d6;--v:#c9a6ff;--v2:#a57fe0;--lav:#3a2556;--rose:#5a2d47;--card:#2a1d3bcc;--line:#c9a6ff2a;--shadow:0 18px 50px #0006;--on:#1a0f2b;--ok:#6cc08a;--warn:#f0b05a;--bad:#ee7b92}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.65 Inter,system-ui,"Segoe UI",sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:500;line-height:1.1;margin:0}
a{color:var(--v)}
:focus-visible{outline:3px solid var(--v2);outline-offset:3px;border-radius:6px}
.wrap{max-width:1080px;margin:auto;padding:0 22px}
nav{position:sticky;top:0;z-index:10;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 80%,transparent);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px;height:62px}
.logo{font-family:Fraunces,serif;font-style:italic;font-size:1.6rem;color:var(--v);text-decoration:none}
nav ul{display:flex;gap:24px;list-style:none;margin:0;padding:0}
nav ul a{color:var(--ink);text-decoration:none;font-size:.95rem;opacity:.8}nav ul a:hover{opacity:1;color:var(--v)}
.tools{display:flex;gap:10px;align-items:center}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;background:var(--card);padding:3px}
.lang button{border:0;background:transparent;color:var(--mut);font:600 .8rem/1 Inter,sans-serif;padding:8px 12px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--v);color:var(--on)}
.tbtn{border:1px solid var(--line);background:var(--card);color:var(--v);border-radius:999px;width:38px;height:38px;cursor:pointer;display:grid;place-items:center}
.tbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:720px){nav ul{display:none}}
.hero{padding:76px 0 56px;background:radial-gradient(55% 60% at 85% 15%,var(--rose) 0,transparent 70%),radial-gradient(45% 55% at 5% 90%,var(--lav) 0,transparent 70%),var(--bg)}
.hero .wrap{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:center}
@media(max-width:860px){.hero .wrap{grid-template-columns:1fr}}
.pill{display:inline-flex;gap:9px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.86rem;color:var(--mut)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--warn)}
h1{font-size:clamp(3.6rem,10vw,7rem);color:var(--v);font-style:italic;margin:18px 0 8px;letter-spacing:-.02em}
.sub{font-family:Fraunces,serif;font-size:1.5rem;line-height:1.25;max-width:22ch;margin:0 0 14px}
.lead{color:var(--mut);max-width:58ch}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{display:inline-block;padding:13px 24px;border-radius:999px;text-decoration:none;font-weight:600;font-size:.95rem;border:1px solid var(--v);transition:background .2s}
.btn.p{background:var(--v);color:var(--on)}.btn.p:hover{background:var(--v2)}
.btn.g{color:var(--v)}.btn.g:hover{background:var(--card)}
.board{position:relative;perspective:1200px;padding-bottom:26px}
.model{position:relative;width:100%;aspect-ratio:900/850;transform-style:preserve-3d;transform:rotateX(-8deg);animation:spin 18s linear infinite}
.board:hover .model{animation-play-state:paused}
.face{position:absolute;inset:0;border-radius:30px;backface-visibility:hidden;box-shadow:var(--shadow);overflow:hidden}
.face img{width:100%;height:100%;object-fit:cover;display:block}
.pic{position:relative}
.face,.pic{container-type:inline-size}
.wm{position:absolute;transform:translate(-50%,-50%);font:500 2.3cqw/1 Inter,sans-serif;letter-spacing:.08em;color:#fff;opacity:.92;white-space:nowrap;pointer-events:none;user-select:none}
.wm.t{left:48.5%;top:86%}.wm.u{left:50%;top:82.5%}
.face.f{transform:translateZ(4px)}.face.b{transform:rotateY(180deg) translateZ(4px)}
.shade{position:absolute;left:14%;right:14%;bottom:0;height:22px;background:radial-gradient(closest-side,#0005,transparent);filter:blur(5px)}
@keyframes spin{to{transform:rotateX(-8deg) rotateY(360deg)}}
section{padding:84px 0}
h2{font-size:clamp(2rem,5vw,3.1rem);margin:0 0 14px}
.alt{background:linear-gradient(180deg,var(--bg2),var(--bg))}
.feat{margin-top:36px;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr auto;gap:8px 24px;align-items:center;padding:22px 0;border-bottom:1px solid var(--line)}
.row h3{font-size:1.35rem;margin-bottom:4px}.row p{margin:0;color:var(--mut);max-width:60ch}
.part{font-weight:600;color:var(--v);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.88rem;white-space:nowrap}
.dots{display:inline-flex;gap:6px;vertical-align:middle}.dots i{width:12px;height:12px;border-radius:50%}
@media(max-width:620px){.row{grid-template-columns:1fr}.row .part{justify-self:start}}
.steps{counter-reset:s;display:grid;gap:14px;margin-top:32px;max-width:760px}
.step{display:grid;grid-template-columns:52px 1fr;gap:18px;align-items:start}
.step:before{counter-increment:s;content:counter(s);font-family:Fraunces,serif;font-style:italic;font-size:1.5rem;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--v);color:var(--on)}
.step b{display:block;font-size:1.1rem;margin-top:2px}.step span{color:var(--mut)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:32px}@media(max-width:760px){.two{grid-template-columns:1fr}}
.two figure{margin:0}.two img{width:100%;display:block;border-radius:26px;box-shadow:var(--shadow)}.two figcaption{color:var(--mut);font-size:.92rem;margin-top:10px;text-align:center}
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 36px;margin:34px 0 0}
.specs div{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.specs dt{color:var(--mut)}.specs dd{margin:0;font-weight:600}
.state{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:30px;margin-top:34px}
.state h3{font-size:1.3rem;display:flex;align-items:center;gap:10px;margin-bottom:8px}
.state h3:before{content:"";width:12px;height:12px;border-radius:50%;background:var(--c)}
.state p{margin:0;color:var(--mut)}
.note{font-family:Fraunces,serif;font-size:1.4rem;line-height:1.35;max-width:34ch;margin:0}
footer{padding:54px 0 64px;text-align:center;color:var(--mut);font-size:.93rem;border-top:1px solid var(--line)}
footer .logo{font-size:2.1rem;display:block;margin-bottom:6px}
footer small{display:block;margin-top:6px}
footer .sig{display:block;margin-top:16px;font-size:.85rem;font-weight:600;letter-spacing:.14em;color:var(--v)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>

const root=document.documentElement,$=s=>document.querySelectorAll(s);
function setLang(l){
 const t=D[l];root.lang=l;document.title=t.title;
 $("[data-i]").forEach(e=>e.textContent=t[e.dataset.i]);
 $("[data-alt]").forEach(e=>e.alt=t[e.dataset.alt]);
 $("[data-a]").forEach(e=>e.setAttribute("aria-label",t[e.dataset.a]));
 $(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===l));
 if(REPO){const r=document.getElementById("repo");r.href=REPO;r.textContent=t.gh}
 try{localStorage.setItem("flora-lang",l)}catch(e){}
}
$(".lang button").forEach(b=>b.onclick=()=>setLang(b.dataset.l));
let l0="es";try{l0=localStorage.getItem("flora-lang")||(navigator.language||"es").slice(0,2)}catch(e){}
setLang(l0==="en"?"en":"es");
const dark=()=>root.dataset.theme==="dark"||(root.dataset.theme==="auto"&&matchMedia("(prefers-color-scheme:dark)").matches);
function icon(){const d=dark();document.getElementById("mo").hidden=d;document.getElementById("su").hidden=!d}
document.getElementById("theme").onclick=()=>{root.dataset.theme=dark()?"light":"dark";icon()};icon();
